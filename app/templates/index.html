<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Commander Messenger</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            font-family: Arial, sans-serif;

            background: #0b0b10;
            color: white;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        /* Background */

        .background {
            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;
        }

        .glow {
            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: rgba(139, 92, 246, 0.12);

            filter: blur(100px);
        }

        .glow-one {
            top: -250px;
            left: -150px;
        }

        .glow-two {
            right: -200px;
            bottom: -250px;

            background: rgba(120, 80, 220, 0.08);
        }

        /* Main */

        .container {
            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 900px;

            padding: 30px;

            text-align: center;
        }

        .brand {
            margin-bottom: 25px;
        }

        .brand h1 {
            margin: 0;

            font-size: clamp(42px, 8vw, 78px);

            font-weight: 800;

            letter-spacing: 7px;

            line-height: 1;
        }

        .brand h1 span {
            color: #8b5cf6;
        }

        .tagline {
            margin-top: 25px;

            font-size: clamp(20px, 3vw, 30px);

            font-weight: 600;

            color: #f1f1f1;
        }

        .description {
            max-width: 550px;

            margin: 18px auto 35px;

            color: #8e8e9a;

            font-size: 16px;

            line-height: 1.7;
        }

        /* Buttons */

        .buttons {
            display: flex;

            justify-content: center;

            gap: 14px;

            flex-wrap: wrap;
        }

        .button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 150px;

            padding: 13px 25px;

            border-radius: 10px;

            font-size: 15px;

            font-weight: bold;

            text-decoration: none;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .button:hover {
            transform: translateY(-3px);
        }

        .login {
            background: #8b5cf6;

            color: white;

            box-shadow:
                0 10px 30px rgba(139, 92, 246, 0.22);
        }

        .login:hover {
            background: #7547df;
        }

        .register {
            background: rgba(255, 255, 255, 0.03);

            color: white;

            border: 1px solid #30303c;
        }

        .register:hover {
            background: rgba(255, 255, 255, 0.07);

            border-color: #555564;
        }

        /* Footer */

        .footer {
            position: fixed;

            bottom: 25px;

            left: 0;

            width: 100%;

            text-align: center;

            color: #555561;

            font-size: 12px;

            z-index: 2;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .container {
                padding: 20px;
            }

            .brand h1 {
                letter-spacing: 4px;
            }

            .description {
                font-size: 14px;
            }

            .button {
                width: 100%;

                max-width: 280px;
            }

        }

    </style>

</head>

<body>

    <div class="background">

        <div class="glow glow-one"></div>

        <div class="glow glow-two"></div>

    </div>


    <main class="container">

        <div class="brand">

            <h1>
                COMMANDER
                <br>
                <span>MESSENGER</span>
            </h1>

        </div>


        <div class="tagline">

            Your messages.
            <br>

            Your world.

        </div>


        <p class="description">

            A simple, modern and private place
            to connect with the people who matter.

        </p>


        <div class="buttons">

            <a
                href="{{ url_for('auth.login') }}"
                class="button login"
            >
                Login
            </a>


            <a
                href="{{ url_for('auth.register') }}"
                class="button register"
            >
                Create Account
            </a>

        </div>

    </main>


    <div class="footer">

        Commander Messenger

    </div>

</body>

</html>
